[package]
name = "niri-settings-app"
description = "GTK4 settings app for the niri compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "niri-settings-app"
path = "src/main.rs"

[dependencies]
niri-settings-core = { path = "../core" }
relm4 = { version = "0.11", features = ["libadwaita", "gnome_50"] }
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
serde.workspace = true
serde_json.workspace = true
niri-ipc.workspace = true

[dev-dependencies]
tempfile.workspace = true
